services:
  app:
    build:
      context: ./app

    env_file:
      - .env
    depends_on:
      - db
      - cache
  db:
    image: postgres:17

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  cache:
    image: redis:8-alpine

volumes:
  postgres_data: